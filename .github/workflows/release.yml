name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create and push next version tag
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --sort=-version:refname --list '0.0.*' | awk '/^0[.]0[.][0-9]+$/ && !found { print; found = 1 }')"
          latest_tag="${latest_tag:-0.0.0}"
          patch="${latest_tag##*.}"
          next_tag="0.0.$((10#$patch + 1))"

          git tag "$next_tag" "$GITHUB_SHA"
          git push origin "refs/tags/$next_tag"

          echo "Created tag \`$next_tag\` for commit \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
